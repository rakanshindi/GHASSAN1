name: Fix rental detail totals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: !contains(github.event.head_commit.message, '[rental-detail-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted UI fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '''<h2>🔑 إدارة إيجارات العقارات</h2>
<div id="rentalsMonthFilter"></div>

<div
class="stats"
style="margin-bottom:20px">'''

          new = '''<h2>🔑 إدارة إيجارات العقارات</h2>
<div id="rentalsMonthFilter"></div>

<div
id="rentalOverviewStats"
class="stats"
style="margin-bottom:20px">'''

          if old not in text:
              raise SystemExit('Rental overview block not found')

          text = text.replace(old, new, 1)

          old = '''window.openPropertyDetails=function(id){

currentOpenedPropertyId=id;

document.getElementById(
"rentalMainView"
).style.display="none";'''

          new = '''window.openPropertyDetails=function(id){

currentOpenedPropertyId=id;

document.getElementById(
"rentalOverviewStats"
).style.display="none";

document.getElementById(
"rentalMainView"
).style.display="none";'''

          if old not in text:
              raise SystemExit('openPropertyDetails block not found')

          text = text.replace(old, new, 1)

          old = '''window.closePropertyDetails=function(){

currentOpenedPropertyId=null;

document.getElementById(
"rentalMainView"
).style.display="block";'''

          new = '''window.closePropertyDetails=function(){

currentOpenedPropertyId=null;

document.getElementById(
"rentalOverviewStats"
).style.display="grid";

document.getElementById(
"rentalMainView"
).style.display="block";'''

          if old not in text:
              raise SystemExit('closePropertyDetails block not found')

          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-rental-detail.yml
          git commit -m "Fix rental detail totals visibility [rental-detail-fix]" || exit 0
          git push